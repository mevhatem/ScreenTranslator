# Android Gradle Plugin non-ASCII karakter kontrolünü devre dışı bırakma
# (Klasör yolundaki "Çevirici" Türkçe karakterleri için zorunludur)
android.overridePathCheck=true

# JVM ve Kodlama ayarları (Türkçe ve non-ASCII karakter encoding desteği)
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Dsun.jnu.encoding=UTF-8
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8

# AndroidX ve Kotlin ayarları
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
